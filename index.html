<h1>yt_plst 개인정보처리방침</h1>
<p>yt_plst 는 운영자 본인 한 명만 쓰는 개인용 알림 봇입니다.</p>
<ul>
<li>유튜브 '나중에 볼 영상' 목록을 읽기 전용(youtube.readonly)으로 가져옵니다.</li>
<li>가져온 정보(영상 제목·주소·추가한 날짜)는 운영자 본인의 서버에만 저장합니다.</li>
<li>어떤 정보도 다른 사람이나 다른 서비스에 보내거나 팔지 않습니다.</li>
<li>구글 계정 설정 &gt; 보안 &gt; 서드파티 앱 에서 언제든 연결을 끊을 수 있습니다.</li>
</ul>
</body>
